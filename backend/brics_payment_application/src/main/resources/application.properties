# Servidor
server.port=8080

# Banco de dados (PostgreSQL — porta 5433)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/brics_db}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:admin123}

# JPA / Hibernate — modo DESENVOLVIMENTO
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway DESATIVADO (por enquanto)
spring.flyway.enabled=false

# Security (JWT)
app.jwt.secret=${JWT_SECRET:umaChaveMuitoLongaESeguraParaOProjetoBricsPayment2026}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.brics=DEBUG