# Servidor
server.port=8080

# Banco de dados (PostgreSQL) a ser substituído pelas variáveis de ambiente DB_URL, DB_USER e DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/brics_db}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:admin123}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway (migrations)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Security (JWT)
app.jwt.secret=${JWT_SECRET:mySecretKey12345678901234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}   # 24 horas

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.brics=DEBUG